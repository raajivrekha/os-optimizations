# ==============================================================================
# FILE NAME: nsmb.conf
# Version: v1.1
# STAMP: 20261116-134045
# FILE OWNERSHIP: root
# FILE GROUP: wheel
# FILE PERMISSIONS: 644 (rw-r--r--)
# DESCRIPTION: SMB client settings for macOS (Tahoe and later).
#              Keys verified against man nsmb.conf. Install at /etc/nsmb.conf.
#              The system file wins over ~/Library/Preferences/nsmb.conf on
#              conflicting keys (see FILES in man nsmb.conf).
#              Changes take effect on remount; no reboot required.
# ==============================================================================

[default]
# ------------------------------------------------------------------------------
# PROTOCOL
# ------------------------------------------------------------------------------
# Bitmap of SMB versions: 7=1/2/3 (factory default), 6=2/3, 4=3 only.
# Disable SMB 1 discovery, keep SMB 2 and 3. Official Apple recipe: HT102050.
protocol_vers_map=6

# Connect on TCP 445 only; do not fail over to NetBIOS/139. Apple HT102050.
# Valid values: both, netbios_only, no_netbios.
port445=no_netbios

# ------------------------------------------------------------------------------
# SIGNING
# ------------------------------------------------------------------------------
# Official key is signing_required (default no). The former reference key
# "signing_optional" is not a valid nsmb.conf keyword (man nsmb.conf) and is
# ignored by the client. signing_required=no asks the client not to require
# packet signing, which helps throughput on a trusted LAN.
# Note: if the server still offers signing, macOS may sign anyway.
signing_required=no

# Skip the SMB 3 validate-negotiate check. Apple HT101956. Safer only on a
# trusted LAN; it increases MitM susceptibility on untrusted networks.
validate_neg_off=yes

# ------------------------------------------------------------------------------
# METADATA / CACHE
# ------------------------------------------------------------------------------
# Use NTFS named streams when the server supports them (default yes). Needed
# for macOS resource-fork / metadata compatibility.
streams=yes

# dir_cache_max is a TIME, default 60s (man nsmb.conf: "Max time to cache for
# a dir"). It is not a RAM-cache size. 1024 seconds (~17 min) reduces Finder
# spinner on large shares. dir_cache_max_cnt (Apple HT208209 / 101918) is a
# different key used only to disable enumeration caching (set to 0).
dir_cache_max=1024

# ------------------------------------------------------------------------------
# THROUGHPUT / STABILITY
# ------------------------------------------------------------------------------
# Multichannel is on by default (mc_on=yes). Prefer a wired NIC when both
# wired and Wi-Fi are up (mc_prefer_wired default is no).
mc_on=yes
mc_prefer_wired=yes

# Soft mounts (man nsmb.conf: "Force all mounts to be soft"; default is no).
# A soft mount fails filesystem calls after a timeout instead of hanging
# forever when the server or network drops. That avoids frozen apps.
# Trade-off: a brief network blip can return an I/O error instead of waiting.
# Do not use soft mounts for Time Machine disk images.
# Takes effect on remount. Existing mounts keep their current hard/soft
# behavior until they are remounted.
soft=yes

# Intentionally omitted (invalid or not in man nsmb.conf):
#   signing_optional   - not a valid keyword; replaced by signing_required
#   ds_store_all_vols  - not a valid nsmb.conf key. .DS_Store on network
#                        shares is controlled by:
#                        defaults write com.apple.desktopservices DSDontWriteNetworkStores -bool true
#   pathconf_cache_off - not listed in man nsmb.conf
